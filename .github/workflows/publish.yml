name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  # Runs BEFORE anything is published, and everything that publishes depends on
  # it. This guard used to live inside github-release, which needed npm publishing
  # — so a tag with a missing or whitespace-only CHANGELOG section published the
  # npm version first and only then failed. npm versions are immutable, so that
  # left an unchangelogged release permanently on the registry, and the workflow
  # could not even be re-run: republishing an existing version fails before
  # reaching the guard. A gate that fires after the irreversible step is not a
  # gate. See docs/RELEASE_PROCESS.md.
  validate-release-notes:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - name: Extract this version's CHANGELOG section
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            f && /^## \[/          { exit }
            f                      { print }
          ' CHANGELOG.md > release-notes.md
          # Not `-s`. A heading with nothing under it still emits the blank
          # separator line, so the file is one byte and passes a size test.
          # Require actual non-whitespace content.
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "ERROR: CHANGELOG.md has no '## [$VERSION]' section, or it is empty." >&2
            echo "Add the section with real content before tagging; release notes come from it." >&2
            exit 1
          fi
          echo "Extracted $(wc -l < release-notes.md) lines of notes for $VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  prepare-release:
    needs: [validate-release-notes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Processing corpus is preserved separately; acquisition tests need no LFS PDFs.
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: uv sync --frozen --group dev
      - run: npm run build
      - name: Run tests
        run: |
          node --experimental-vm-modules node_modules/jest/bin/jest.js
          uv run pytest -m "not slow and not integration" --benchmark-disable
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "ERROR: tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
      # Pack once: npm and the Docker gate consume these exact release bytes.
      - name: Pack the release once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release-package"
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Ships the same release as a container image so Docker users get versioned
  # tags instead of having to build from source (requested in issue #9).
  # Tag pushes only: a workflow_dispatch has no semver ref, so metadata-action
  # would derive zero tags and the push step would fail.
  publish-packages:
    if: startsWith(github.ref, 'refs/tags/v')
    # Both registries wait for the suites AND the packed-image smoke. Keep the
    # build, smoke and push in this job so no rebuild can change the candidate.
    needs: [validate-release-notes, prepare-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci --ignore-scripts
      # OIDC trusted publishing requires npm >= 11.5.1 (Node 22 bundles 10.x).
      # Keep the npm@11 pin; npm@latest previously outran the runner's Node.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package
      - name: Prepare the exact npm release as Docker input
        shell: bash
        run: |
          bash scripts/prepare-image-context.sh "$RUNNER_TEMP/image-context" "$RUNNER_TEMP"/release-package/*.tgz
      # The classic image store drops BuildKit attestation manifests on load.
      - uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and load the release image (not yet pushed)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/image-context
          file: docker/Dockerfile
          build-args: BUILD_INPUT=packed
          load: true
          push: false
          provenance: mode=min
          tags: |
            zlibrary-mcp:smoke
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Bind the loaded attested index to the build digest
        id: image-identity
        env:
          TESTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/image-identity.mjs zlibrary-mcp:smoke "$TESTED_DIGEST"
      - name: Gate both publications on the offline SDK-to-Python journey
        run: node scripts/image-smoke.mjs zlibrary-mcp:smoke
      # Auth comes from this workflow's OIDC trusted publisher; no token.
      - name: Publish with provenance
        run: npm publish "$RUNNER_TEMP"/release-package/*.tgz --provenance
      # Push the already-tested local image, never rebuild after the smoke.
      - name: Push the tested image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          TESTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/push-tested-image.mjs zlibrary-mcp:smoke "$TESTED_DIGEST"

  # A tag that publishes to npm and GHCR but leaves no GitHub Release makes the
  # Releases page disagree with what is actually shipped. That happened to
  # v1.4.0 (#108): npm, GHCR and the tag were all live while Releases still
  # showed v1.3.2 as latest. The release notes are the CHANGELOG section for
  # this version, so the changelog stays the single source of truth — and the
  # extraction failing loudly is what keeps an unchangelogged release from
  # shipping silently.
  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate-release-notes, publish-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      # Reuse the artifact validate-release-notes produced rather than
      # re-extracting. Two copies of the awk would be two things to drift, and
      # the notes published here must be exactly the bytes that were validated.
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --latest
